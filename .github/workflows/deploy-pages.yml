name: Deploy till GitHub Pages

on:
  push:
    branches: [claude/swedish-voter-compass-42d6l8, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Kontrollera att alla bilder fungerar
        run: python3 tools/check_images.py
      - name: Aktivera och konfigurera Pages
        uses: actions/configure-pages@v5
        with:
          enablement: enabled
      - name: Paketera sidan
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploya
        id: deployment
        uses: actions/deploy-pages@v4
